# Local infra for when the scaffold graduates from in-memory adapters to real services.
# `docker compose up -d` then set STORE_DRIVER=postgres / CACHE_DRIVER=redis in .env.
# The image bundles PostGIS + pgvector + TimescaleDB so the relational repositories (and the
# 0001/0002 migrations mounted below) all work. For the full app + API in one command, use
# docker-compose.prod.yml instead.
services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: smartcart
      POSTGRES_DB: smartcart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcart"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
